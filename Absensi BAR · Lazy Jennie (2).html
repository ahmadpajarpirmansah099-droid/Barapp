return`${adm()?'<div style="margin-bottom:12px"><button class="btn" onclick="openEmp(-1)">+ Tambah karyawan</button></div>':''}<div class="card"><div class="row"><label>Cari nama<input value="${esc(F.q)}" oninput="F.q=this.value;clearTimeout(T.h);T.h=setTimeout(()=>{R();const i=document.querySelector('[data-q]');i&&(i.focus(),i.setSelectionRange(99,99))},350)" data-q></label></div></div>`+

function pic(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const s=Math.min(1,700/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);T.ph=c.toDataURL('image/jpeg',.6);$('#pv').innerHTML=`<img class="ph" src="${T.ph}">`};im.onerror=()=>toast('File bukan gambar','err');im.src=r.result};r.readAsDataURL(f)}
function saveAtt(){if(!guard())return;const e=v('ae'),d=v('ad');if(!e)return toast('Pilih karyawan','err');if(!d)return toast('Tanggal wajib diisi','err');if(!T.st)return toast('Status wajib dipilih','err');
const dup=D.att.findIndex((a,i)=>a.e==e&&a.d==d&&i!=T.k);if(dup>=0)return toast('Data karyawan ini di tanggal tsb sudah ada (duplikat ditolak)','warn');
if(T.k>=0&&lockedD(D.att[T.k].d))return toast('Data asli ada di periode LOCKED. Unlock di Atur & Laporan.','err');const p=ensurePer(d);if(!p)return toast('Tanggal bertumpuk dengan periode lain. Cek di Atur & Laporan.','err');if(p.lock)return toast('Periode LOCKED. Unlock di Atur & Laporan.','err');
const o={e,d,s:T.st,n:v('an').trim(),ph:T.st=='S'?T.ph:''};if(T.k>=0)D.att[T.k]=o;else D.att.push(o);jump(d);sv();closeM();toast('Absensi tersimpan');R()}
function delAtt(){if(!guard())return;const a=D.att[T.k];if(lockedD(a.d))return toast('Periode LOCKED','err');cf('Hapus data absensi ini?',()=>{D.att.splice(T.k,1);sv();toast('Absensi dihapus');R()})}

/* ---------- Lembur ---------- */
V.ot=()=>{const {f,t}=rng(),l=D.ot.map((o,i)=>({...o,i})).filter(o=>(adm()||D.me.r=='G'||o.e==D.me.id)&&o.d>=f&&o.d<=t&&(!F.e||o.e==F.e)&&(!F.q||(name(o.e)+(o.n||'')).toLowerCase().includes(F.q.toLowerCase()))).sort((a,b)=>a.d<b.d?1:-1),tot=l.reduce((s,o)=>s+hrs(o),0),ids=[...new Set(l.map(o=>o.e))];
return(adm()?'<div style="margin-bottom:12px"><button class="btn" onclick="openOt(-1)">+ Tambah lembur</button></div>':'')+fbar(1)+(l.length?`<div class="card"><b>Total jam lembur: ${fh(tot)}</b>${ids.map(e=>`<div>${esc(name(e))}: <b>${fh(l.filter(o=>o.e==e).reduce((s,o)=>s+hrs(o),0))}</b></div>`).join('')}</div><div class="tw"><table><tr><th>Nama</th><th>Tanggal</th><th>Jam</th>${adm()?'<th></th>':''}</tr>${l.map(o=>`<tr><td>${esc(name(o.e))}</td><td>${fd(o.d)}</td><td>${Math.round(hrs(o)*100)/100}</td>${adm()?`<td><button class="btn s x" onclick="openOt(${o.i})">Edit</button> <button class="btn d x" onclick="delOt(${o.i})">Hapus</button></td>`:''}</tr>`).join('')}</table></div>`:'<div class="card empty">Belum ada lembur pada rentang ini.</div>')};
function openOt(i){if(!guard())return;if(!D.emp.length)return toast('Tambah karyawan dulu','warn');const o=i>=0?D.ot[i]:{d:today()};T.i=i;
modal(`<h3>${i>=0?'Edit':'Tambah'} Lembur / Extend</h3>${i>=0?`<label>Karyawan<select id="oe">${D.emp.map(e=>`<option value="${esc(e.id)}" ${e.id==o.e?'selected':''}>${esc(e.nama)}</option>`).join('')}</select></label>`:`<label>Pilih karyawan (boleh lebih dari satu) · <a class="nm" onclick="document.querySelectorAll('#oc input').forEach(x=>x.checked=true)">Pilih semua</a></label><div id="oc" style="margin-bottom:10px">${D.emp.filter(e=>e.aktif).map(e=>`<label class="ck"><input type="checkbox" value="${esc(e.id)}"> ${esc(e.nama)}</label>`).join('')}</div>`}<label>Tanggal<input id="od" type="date" value="${o.d}"></label><label>Total jam lembur<input id="oh" type="number" min="0.25" max="24" step="0.25" inputmode="decimal" value="${i>=0?Math.round(hrs(o)*100)/100:''}" placeholder="mis. 2.5"></label><div class="row"><button class="btn s" onclick="closeM()">Batal</button><button class="btn" onclick="saveOt()">Simpan</button></div>`)}
function saveOt(){if(!guard())return;const d=v('od'),h=+v('oh'),n=v('on').trim(),ids=T.i>=0?[v('oe')]:[...document.querySelectorAll('#oc input:checked')].map(x=>x.value);
if(!ids.length||!ids[0])return toast('Pilih minimal satu karyawan','err');if(!d)return toast('Tanggal wajib diisi','err');if(!(h>0&&h<=24))return toast('Total jam harus antara 0 dan 24','err');if(lockedD(d)||(T.i>=0&&lockedD(D.ot[T.i].d)))return toast('Periode LOCKED','err');
if(T.i>=0)D.ot[T.i]={e:ids[0],d,h,n};else ids.forEach(e=>D.ot.push({e,d,h,n}));jump(d);sv();closeM();toast('Lembur tersimpan ('+ids.length+' karyawan)');R()}
function delOt(i){if(!guard())return;cf('Hapus data lembur ini?',()=>{if(lockedD(D.ot[i].d))return toast('Periode LOCKED','err');D.ot.splice(i,1);sv();toast('Lembur dihapus');R()})}

/* ---------- Laporan: periode, export, import ---------- */
V.lap=()=>{const l=D.per.at(-1),s=l?iso(U(l.e)+864e5):today().slice(0,8)+'24',y=+s.slice(0,4),m=+s.slice(5,7),e=iso(Date.UTC(m==12?y+1:y,m%12,23));
return`<div class="card"><h3>Periode absensi</h3>${D.per.length?D.per.map(p=>`<div class="row" style="margin-bottom:6px"><div>${pl(p)} ${p.lock?'<span class="tag r">LOCKED</span>':'<span class="tag">Terbuka</span>'}</div><button class="btn s x" onclick="lockP('${p.id}')">${p.lock?'Unlock':'Lock'}</button><button class="btn d x" onclick="delP('${p.id}')">Hapus</button></div>`).join(''):'<p class="mu">Belum ada periode.</p>'}<div class="row"><label>Mulai<input id="ps1" type="date" value="${s}"></label><label>Akhir<input id="ps2" type="date" value="${e}"></label><button class="btn" onclick="addP()">Buat periode</button></div></div>
<div class="card"><h3>Reset data</h3><p class="mu">Hapus semua karyawan, absensi, lembur, dan periode (akun admin & tema tetap). Berguna setelah uji coba selesai.</p><button class="btn d" onclick="resetAll()">Hapus semua data</button></div>
<div class="card"><h3>Tema & Tampilan</h3><p class="mu">Ubah bahasa, judul, font, warna, dan animasi.</p><button class="btn" onclick="openTheme()">Edit tema</button></div>`};
function addP(){if(!guard())return;const s=v('ps1'),e=v('ps2');if(!s||!e)return toast('Tanggal wajib diisi','err');if(e<s)return toast('Tanggal akhir tidak boleh sebelum mulai','err');if(D.per.some(p=>s<=p.e&&e>=p.s))return toast('Periode bertumpuk dengan periode lain','err');const p={id:'p'+Date.now(),s,e,lock:false};D.per.push(p);D.per.sort((a,b)=>a.s<b.s?-1:1);D.cur=p.id;sv();toast('Periode dibuat');R()}
function lockP(id){if(!guard())return;const p=P(id);p.lock=!p.lock;sv();toast(p.lock?'Periode dikunci':'Periode dibuka');R()}
function delP(id){if(!guard())return;const p=P(id);cf(`Hapus periode ${pl(p)}? Data absensi di rentang ini ikut terhapus.`,()=>{if(p.lock)return toast('Unlock dulu','err');D.att=D.att.filter(a=>a.d<p.s||a.d>p.e);D.per=D.per.filter(q=>q.id!=id);sv();toast('Periode dihapus');R()})}
function resetAll(){if(!guard())return;cf('Hapus SEMUA data karyawan, absensi, lembur, dan periode? Tidak bisa dibatalkan.',()=>{D.emp=[];D.att=[];D.ot=[];D.per=[];D.cur='';F.f=F.t=F.q=F.e='';sv();toast('Semua data dihapus');R()})}
function ex(k){if(!guard())return;const {f,t}=rng();if(f>t)return toast('Tanggal mulai harus sebelum tanggal akhir','err');const l=flt(f,t),ds=days(f,t),R_=[];let n='absensi';
if(k=='matrix'){n='rekap-absensi';R_.push(['Nama',...ds.map(d=>d.slice(5)),'M','L','I','S','PH','Belum ada data']);l.forEach(e=>{const c=cntR(f,t,[e]);R_.push([e.nama,...ds.map(d=>(rec(e.id,d)||{s:'BELUM ADA DATA'}).s),c.M,c.L,c.I,c.S,c.PH,c.B])})}
if(k=='emp'){n='rekap-karyawan';R_.push(['ID','Nama','Total Hari Kerja (M)','L','I','S','PH','Belum ada data','Jam lembur','Sisa PH']);l.forEach(e=>{const c=cntR(f,t,[e]);R_.push([e.id,e.nama,c.M,c.L,c.I,c.S,c.PH,c.B,otH(e,f,t),e.sph||0])})}
if(k=='det'){n='detail-absensi';R_.push(['ID','Nama','Tanggal','Status','Catatan']);l.forEach(e=>ds.forEach(d=>{const a=rec(e.id,d);a&&R_.push([e.id,e.nama,d,a.s,a.n])}))}
if(k=='blank'){n='belum-ada-data';R_.push(['ID','Nama','Tanggal']);l.forEach(e=>ds.forEach(d=>rec(e.id,d)||R_.push([e.id,e.nama,d])))}
if(k=='ot'){n='lembur';R_.push(['Tanggal','Nama','Jam lembur','Catatan']);D.ot.filter(o=>o.d>=f&&o.d<=t&&(!F.e||o.e==F.e)).sort((a,b)=>a.d<b.d?-1:1).forEach(o=>R_.push([o.d,name(o.e),hrs(o),o.n||'']))}
if(R_.length<2)return toast('Tidak ada data untuk diekspor','warn');dl(n+'-'+f+'_'+t,R_)}
let DL=null;try{window.claude&&claude.use('downloads').then(x=>DL=x).catch(()=>{})}catch(e){}
async function dl(n,rows){const t='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
if(DL){try{await DL.save({filename:n+'.csv',data:new Blob([t],{type:'text/csv'})});return}catch(e){if(e&&e.code=='declined')return}}
modal(`<h3>${esc(n)}.csv</h3><p class="mu">Unduhan langsung tidak tersedia di sini. Salin teks CSV ini.</p><textarea readonly rows="10" onfocus="this.select()">${esc(t)}</textarea><br><br><button class="btn s" onclick="closeM()">Tutup</button>`)}
function csvp(t){const r=[];let row=[],c='',q=0;t=t.replace(/^\ufeff/,'');for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'&&t[i+1]=='"'){c+='"';i++}else if(ch=='"')q=0;else c+=ch}else if(ch=='"')q=1;else if(ch==','||ch==';'){row.push(c);c=''}else if(ch=='\n'){row.push(c);r.push(row);row=[];c=''}else if(ch!='\r')c+=ch}if(c||row.length){row.push(c);r.push(row)}return r.filter(x=>x.some(y=>y.trim()))}
function imp(inp,k){if(!guard())return;const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let rows=csvp(r.result),ok=0,sk=0;if(rows.length&&/^(id|nama)/i.test(rows[0][0].trim()))rows.shift();
rows.forEach(x=>{const [a,b,c,d,e,g]=x.map(y=>y.trim());if(k=='emp'){if(!a||!b||D.emp.some(z=>z.id==a))return sk++;D.emp.push({id:a,nama:b,jab:c||'',lahir:d||'',gabung:e||'',kontak:g||'',sph:Math.max(0,+x[6]||0),aktif:true});ok++}
else{const s=(c||'').toUpperCase();if(!D.emp.some(z=>z.id==a)||!/^\d{4}-\d{2}-\d{2}$/.test(b)||!ST[s]||!perOf(b)||lockedD(b)||rec(a,b))return sk++;D.att.push({e:a,d:b,s,n:d||'',ph:''});ok++}});
sv();inp.value='';toast(`Import selesai: ${ok} masuk, ${sk} dilewati (tidak valid/duplikat/locked)`,ok?'':'warn');R()};r.readAsText(f)}
const sanF=x=>x.replace(/[^\w ]/g,'').trim(),MN={dash:['Menu Rekap','Summary menu'],abs:['Menu Input Harian','Daily Input menu'],kar:['Menu Karyawan','Employees menu'],ot:['Menu Lembur','Overtime menu'],lap:['Menu Atur & Laporan','Settings & Reports menu']};

<div class="ts">${L('1. Bahasa','1. Language')}</div><select onchange="setLang(this.value)">${Object.entries(LANGS).map(([k,n])=>`<option value="${k}" ${k==LANG?'selected':''}>${n}</option>`).join('')}</select>
<div class="ts">${L('2. Judul & nama menu','2. Titles & menu names')}</div><label>${L('Judul aplikasi','App title')}<input value="${esc(TH.name)}" oninput="TH.name=this.value;R()"></label><label>${L('Nama usaha (tulisan kecil di header)','Business name (small text in header)')}<input value="${esc(TH.sub)}" oninput="TH.sub=this.value;R()"></label><div class="grid">${Object.keys(THEME.nav).map(k=>`<label>${L(MN[k][0],MN[k][1])}<input value="${esc(TH.nav[k])}" oninput="TH.nav['${k}']=this.value;R()"></label>`).join('')}</div>

<div class="ts">${L('5. Bentuk & animasi','5. Shape & animation')}</div><label>${L('Kebulatan sudut','Corner roundness')}<input type="range" min="0" max="40" value="${TH.radius}" oninput="TH.radius=+this.value;applyTheme()"></label><label>${L('Kecepatan animasi (0 = mati)','Animation speed (0 = off)')}<input type="range" min="0" max="2" step="0.1" value="${TH.speed}" oninput="TH.speed=+this.value;applyTheme()"></label>
<div class="row" style="margin-top:12px"><button class="btn s" onclick="TH=JSON.parse(JSON.stringify(THEME));applyTheme();R();openTheme()">${L('Kembalikan bawaan','Restore defaults')}</button><button class="btn s" onclick="closeM()">${L('Batal','Cancel')}</button><button class="btn" onclick="saveTheme()">${L('Simpan','Save')}</button></div>`)}

if(typeof MutationObserver!='undefined')new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(trDom))).observe(document.body,{childList:true,subtree:true});
