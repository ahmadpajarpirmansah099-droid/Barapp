name: COGS branch QA

on:
  push:
    branches:
      - main
      - feat/cogs-backend-v1
      - refactor/app-shell-dashboards
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  static-qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build with Vite
        run: npm run build

      - name: Check inline JavaScript syntax
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/gi)]
            .map(match => match[1])
            .filter(script => script.trim().length > 0);
          if (!scripts.length) throw new Error('No inline scripts found');
          scripts.forEach((script, index) => {
            try {
              new Function(script);
              console.log(`Inline script ${index + 1}: syntax OK (${script.length} chars)`);
            } catch (error) {
              console.error(`Inline script ${index + 1}: syntax ERROR`);
              throw error;
            }
          });
          NODE

      - name: Check employee session token storage
        run: node scripts/security-session-storage.test.cjs

      - name: Check Approval Closing Excel importer
        run: node scripts/closing-template-import.test.cjs

      - name: Check expected COGS UI and RPC wiring
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const sql = fs.readFileSync('barapp_cogs_daily_so_active_only_v1.sql', 'utf8');
          const required = [
            'Master Bahan',
            'Resep WIP',
            'Menu',
            'Produksi WIP',
            'Daily SO',
            'Penjualan Menu',
            'cogs_record_production',
            'cogs_record_menu_sale',
            'cogs_save_daily_so',
            'cogs_get_stock_position',
            'Preserve the complete submitted SO snapshot'
          ];
          const missing = required.filter(value => !html.includes(value));
          if (!sql.includes('i.active=true') || !sql.includes('w.active=true') || !sql.includes('COGS_SO_ITEM_INVALID_OR_INACTIVE') || !sql.includes('COGS_SO_WIP_INVALID_OR_INACTIVE')) {
            missing.push('active-only Daily SO backend validation');
          }
          if (missing.length) {
            console.error('Missing expected markers:', missing.join(', '));
            process.exit(1);
          }
          console.log(`All ${required.length} COGS UI/RPC markers found.`);
          NODE

      - name: Verify GitHub Pages-ready Vite output
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.resolve('dist');
          const htmlPath = path.join(root, 'index.html');
          if (!fs.existsSync(htmlPath)) throw new Error('dist/index.html was not created');

          const html = fs.readFileSync(htmlPath, 'utf8');
          const tags = [...html.matchAll(/<(?:script|link)\b[^>]*>/gi)].map(match => match[0]);
          const refs = [];
          for (const tag of tags) {
            const attr = tag.match(/\b(?:src|href)=["']([^"']+)["']/i);
            if (attr) refs.push(attr[1]);
          }

          const missing = [];
          for (const ref of refs) {
            if (/^(?:[a-z]+:|\/\/|#)/i.test(ref)) continue;
            if (ref.startsWith('/')) {
              missing.push(ref + ' (absolute path; expected relative path for /Barapp/)');
              continue;
            }
            const pathname = decodeURIComponent(ref.split(/[?#]/, 1)[0]);
            const target = path.resolve(root, pathname.replace(/^\.\//, ''));
            if (!target.startsWith(root + path.sep) || !fs.existsSync(target)) missing.push(ref);
          }
          if (missing.length) {
            console.error('Invalid local references in dist/index.html:', missing.join(', '));
            process.exit(1);
          }

          const required = [
            'sw.js',
            'core/config.js',
            'features/dashboard/operational.js',
            'closing.js',
            'guest-arrival.js'
          ];
          const absent = required.filter(file => !fs.existsSync(path.join(root, file)));
          if (absent.length) {
            console.error('Missing required Vite output files:', absent.join(', '));
            process.exit(1);
          }
          console.log('Pages-ready output OK. Local script/link references checked:', refs.length);
          NODE

      - name: Mark output to bypass Jekyll processing
        run: touch dist/.nojekyll

      - name: Upload Vite dry-run artifact (not deployed)
        uses: actions/upload-artifact@v4
        with:
          name: barapp-vite-pages-dry-run-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
