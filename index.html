/* ---------- COGS CLOUD STORAGE ----------
   Supabase is the shared source of truth for COGS. localStorage CGK remains only a cache. */
let CGSAVE=Promise.resolve(), CGLOADING=false;
function cogsNormalize(x){
  if(!x||typeof x!='object')return null;
  return {
    bahan:Array.isArray(x.bahan)?x.bahan:[],
    wip:Array.isArray(x.wip)?x.wip:[],
    menu:Array.isArray(x.menu)?x.menu:[]
  };
}
async function cogsLoad(){
  if(!D.me||CGLOADING)return false;
  CGLOADING=true;
  try{
    const c=sb();
    const {data,error}=await c.from('cogs_data').select('id,data,updated_at').eq('id',1).maybeSingle();
    if(error)throw error;
    if(data&&data.data){
      const cloud=cogsNormalize(data.data);
      if(cloud){
        D.cg=cloud;
        try{localStorage.setItem(CGK,JSON.stringify(D.cg))}catch(e){}
        sv();
        return true;
      }
    }
    // First-time cloud initialization: use existing device data if present;
    // otherwise use the existing starter dataset. Never overwrite an existing cloud row.
    const local=cogsNormalize(D.cg);
    const seed=local||JSON.parse(JSON.stringify(CG_SEED));
    D.cg=seed;
    const {error:upErr}=await c.from('cogs_data').upsert({id:1,data:seed,updated_at:new Date().toISOString()},{onConflict:'id'});
    if(upErr)throw upErr;
    try{localStorage.setItem(CGK,JSON.stringify(seed))}catch(e){}
    sv();
    return true;
  }catch(e){
    console.warn('COGS cloud load:',e);
    // Offline fallback: retain the device cache; cloud remains authoritative when reachable.
    return false;
  }finally{CGLOADING=false}
}
function cogsSave(){
  if(!adm()||!D.cg)return Promise.resolve(false);
  CGSAVE=CGSAVE.then(async()=>{
    const snapshot=cogsNormalize(D.cg);
    if(!snapshot)return false;
    try{
      const {error}=await sb().from('cogs_data').upsert({id:1,data:snapshot,updated_at:new Date().toISOString()},{onConflict:'id'});
      if(error)throw error;
      try{localStorage.setItem(CGK,JSON.stringify(snapshot))}catch(e){}
      return true;
    }catch(e){
      console.warn('COGS cloud save:',e);
      return false;
    }
  }).catch(()=>false);
  return CGSAVE;
}

async function initAuth(){
  try{
    const c=sb();
    const {data,error}=await c.auth.getSession();
    if(error)throw error;

    // localStorage is NEVER trusted as proof of Admin authentication.
    // Only a live Supabase Auth session can create D.me.r='A'.
    if(data.session){
      D.me={r:'A',uid:data.session.user.id,email:data.session.user.email||''};
      sv();
      await cogsLoad();
      R();
    }else{
      if(D.me&&D.me.r=='A'){D.me=null;sv()}
      R();
    }

    c.auth.onAuthStateChange((event,session)=>{
      if(event=='SIGNED_IN'&&session){
        D.me={r:'A',uid:session.user.id,email:session.user.email||''};
        sv();
        setTimeout(async()=>{await cogsLoad();R()},0);
      }else if(event=='SIGNED_OUT'){
        if(D.me&&D.me.r=='A'){D.me=null;sv()}
        R();
      }
    });
  }catch(e){
    console.warn('Supabase Auth:',e);
    if(D.me&&D.me.r=='A'){D.me=null;sv()}
    R();
  }
}

function cgEng(){const g=cgInit(),bm={},wm={},memo={},stk={};g.bahan.forEach(b=>bm[norm(b.nama)]=b);g.wip.forEach(w=>wm[norm(w.nama)]=w);
const unit=n=>{n=norm(n);if(n in memo)return memo[n];
if(wm[n]){if(stk[n])return{c:0,miss:true};stk[n]=1;const r=lines(wm[n].items),y=+wm[n].yield;delete stk[n];return memo[n]={c:y>0?r.total/y:0,miss:r.miss||!(y>0)}}
if(bm[n]){const b=bm[n],c=(+b.beli>0&&+b.isi>0)?b.beli/b.isi:0;return memo[n]={c,miss:!(c>0)}}
return memo[n]={c:0,miss:true}};
const lines=items=>{let total=0,miss=false;const rows=items.map(it=>{const u=unit(it.n),sub=u.c*(+it.q||0);total+=sub;if(u.miss)miss=true;return{...it,price:u.c,sub,miss:u.miss}});return{rows,total,miss}};
return{unit,lines,bm,wm}}
const cgSearch=()=>`<div class="card"><label>${L('Cari','Search')}<input value="${esc(T.cq||'')}" oninput="T.cq=this.value;clearTimeout(T.h);T.h=setTimeout(()=>{R();const i=document.querySelector('[data-q]');i&&(i.focus(),i.setSelectionRange(99,99))},350)" data-q></label></div>`;
const cgQuick=()=>!adm()?'':[['menu',L('Tambah menu','Add menu'),'cg_menu'],['wip',L('Tambah resep WIP','Add WIP recipe'),'cg_wip'],['bahan',L('Tambah bahan','Add ingredient'),'cg_bahan']].map(x=>`<button onclick="cgOpen('${x[0]}',-1)">${IC(x[2])}<span>${x[1]}</span></button>`).join('');
/* cost bahan = harga beli / isi (per satuan). cost WIP = total cost / yield. nested WIP didukung: WIP boleh memakai WIP lain (rekursif, ada penjaga siklus).
   Bahan tanpa harga TIDAK dianggap Rp0: hasilnya ditandai "-" (belum lengkap). Semua rumus mengambil harga langsung dari halaman BAHAN. */
const cgM=(m,r)=>{const h=+m.harga;if(!(h>0)||r.miss||!(r.total>0))return null;const gp=h-r.total;return{cp:r.total/h*100,gp,gm:gp/h*100}};
const cgCells=(m,r)=>{const x=cgM(m,r);return x?{cp:pct(x.cp),gp:rp(x.gp),gm:pct(x.gm)}:{cp:'-',gp:'-',gm:'-'}};
function cgMenuRecipeRows(items,E,depth=0,scale=1,stack={}){
  const out=[];
  (items||[]).forEach(it=>{
    const n=norm(it.n), q=(+it.q||0)*scale, w=E.wm[n];
    const u=E.unit(it.n), sub=u.miss?0:u.c*q;
    out.push({n:it.n,q,u:it.u||'',price:u.c,sub,miss:u.miss,wip:!!w,depth});
    if(w&&!stack[n]){
      const next={...stack,[n]:true},ys=+w.yield||0;
      if(ys>0)out.push(...cgMenuRecipeRows(w.items,E,depth+1,q/ys,next));
    }
  });
  return out;
}

    ${r.miss?`<p class="mu">! = ${L('Ada bahan/WIP yang belum memiliki harga lengkap, sehingga Total Cost, COGS %, dan Profit ditampilkan sebagai -','Some ingredients/WIP have incomplete pricing, so Total Cost, COGS %, and Profit are shown as -')}</p>`:''}
    <p class="mu">${L('WIP ditampilkan sampai komponen di dalamnya, termasuk gramasi pemakaian yang sudah disesuaikan dengan yield.','WIP is expanded to its components, including usage quantities adjusted to the WIP yield.')}</p>

const cgNames=()=>{const g=cgInit();return[...new Set([...g.bahan.filter(b=>b.aktif!==false),...g.wip].map(x=>x.nama))]},cgRows=()=>T.cgf.items.map((x,k)=>`<div class="cgr"><input list="cgn" id="rn${k}" placeholder="${L('Bahan','Ingredient')}" value="${esc(x.n)}"><input id="rq${k}" type="number" min="0" step="any" inputmode="decimal" placeholder="${L('Jumlah','Qty')}" value="${x.q}"><input id="ru${k}" list="cgu" value="${esc(x.u||'')}" placeholder="${L('satuan','unit')}"><button class="btn x" onclick="cgDel(${k})">×</button></div>`).join('');

<div class="card"><h3>Supabase</h3><p class="mu">${sbLabel()} · ${(()=>{try{return esc(new URL(sbCfg().url).host)}catch(e){return '-'}})()}</p><div class="btns"><button class="btn" onclick="openSb()">${L('Atur sambungan','Connection settings')}</button><button class="btn s" onclick="sbLoad()">${L('Muat ulang','Reload')}</button><button class="btn s" onclick="migrateLocal()">${L('Salin data lokal lama...','Copy old local data...')}</button></div></div>
<div class="card"><h3>Reset data</h3><p class="mu">Hapus semua karyawan & absensi di Supabase (semua perangkat), serta lembur dan periode lokal (akun admin & tema tetap). Berguna setelah uji coba selesai.</p><button class="btn d" onclick="resetAll()">Hapus semua data</button></div>
<div class="card"><h3>Tema & Tampilan</h3><p class="mu">Ubah bahasa, judul, font, warna, dan animasi.</p><button class="btn" onclick="openTheme()">Edit tema</button></div>`};
function addP(){if(!guard())return;const s=v('ps1'),e=v('ps2');if(!s||!e)return toast('Tanggal wajib diisi','err');if(e<s)return toast('Tanggal akhir tidak boleh sebelum mulai','err');if(D.per.some(p=>s<=p.e&&e>=p.s))return toast('Periode bertumpuk dengan periode lain','err');const p={id:'p'+Date.now(),s,e,lock:false};D.per.push(p);D.per.sort((a,b)=>a.s<b.s?-1:1);D.cur=p.id;sv();toast('Periode dibuat');R()}
function lockP(id){if(!guard())return;const p=P(id);p.lock=!p.lock;sv();toast(p.lock?'Periode dikunci':'Periode dibuka');R()}
function delP(id){if(!guard())return;const p=P(id);cf(`Hapus periode ${pl(p)}? Data absensi di rentang ini ikut terhapus.`,async()=>{if(p.lock)return toast('Unlock dulu','err');
const ok=await sbRun(async()=>{const {error}=await sb().from('attendance').delete().gte('attendance_date',p.s).lte('attendance_date',p.e);if(error)throw error;D.att.filter(a=>a.d>=p.s&&a.d<=p.e).forEach(a=>delete PH[a.id]);savePH();D.att=D.att.filter(a=>a.d<p.s||a.d>p.e);D.per=D.per.filter(q=>q.id!=id);sv();sbCacheSave()});
if(ok){toast('Periode dihapus');R()}})}
function resetAll(){if(!guard())return;cf('Hapus SEMUA data karyawan & absensi di Supabase (semua perangkat), serta lembur dan periode lokal? Tidak bisa dibatalkan.',async()=>{
const ok=await sbRun(async()=>{const c=sb();let q=await c.from('attendance').delete().not('id','is',null);if(q.error)throw q.error;q=await c.from('employees').delete().not('id','is',null);if(q.error)throw q.error;D.emp=[];D.att=[];D.ot=[];D.per=[];D.cur='';F.f=F.t=F.q=F.e='';PH={};savePH();sv();sbCacheSave()});
if(ok){toast('Semua data dihapus');R()}})}
function ex(k){if(!guard())return;const {f,t}=rng();if(f>t)return toast('Tanggal mulai harus sebelum tanggal akhir','err');const l=flt(f,t),ds=days(f,t),R_=[];let n='absensi';
if(k=='matrix'){n='rekap-absensi';R_.push(['Nama',...ds.map(d=>d.slice(5)),'M','L','I','S','PH','Belum ada data']);l.forEach(e=>{const c=cntR(f,t,[e]);R_.push([e.nama,...ds.map(d=>(rec(e.id,d)||{s:'BELUM ADA DATA'}).s),c.M,c.L,c.I,c.S,c.PH,c.B])})}
if(k=='emp'){n='rekap-karyawan';R_.push(['ID','Nama','Total Hari Kerja (M)','L','I','S','PH','Belum ada data','Jam lembur','Sisa PH']);l.forEach(e=>{const c=cntR(f,t,[e]);R_.push([e.id,e.nama,c.M,c.L,c.I,c.S,c.PH,c.B,otH(e,f,t),e.sph||0])})}
if(k=='det'){n='detail-absensi';R_.push(['ID','Nama','Tanggal','Status','Catatan']);l.forEach(e=>ds.forEach(d=>{const a=rec(e.id,d);a&&R_.push([e.id,e.nama,d,a.s,a.n])}))}
if(k=='blank'){n='belum-ada-data';R_.push(['ID','Nama','Tanggal']);l.forEach(e=>ds.forEach(d=>rec(e.id,d)||R_.push([e.id,e.nama,d])))}
if(k=='ot'){n='lembur';R_.push(['Tanggal','Nama','Jam lembur','Catatan']);D.ot.filter(o=>o.d>=f&&o.d<=t&&(!F.e||o.e==F.e)).sort((a,b)=>a.d<b.d?-1:1).forEach(o=>R_.push([o.d,name(o.e),hrs(o),o.n||'']))}
if(R_.length<2)return toast('Tidak ada data untuk diekspor','warn');dl(n+'-'+f+'_'+t,R_)}
let DL=null;try{window.claude&&claude.use('downloads').then(x=>DL=x).catch(()=>{})}catch(e){}
async function dl(n,rows){const t='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
if(DL){try{await DL.save({filename:n+'.csv',data:new Blob([t],{type:'text/csv'})});return}catch(e){if(e&&e.code=='declined')return}}
modal(`<h3>${esc(n)}.csv</h3><p class="mu">Unduhan langsung tidak tersedia di sini. Salin teks CSV ini.</p><textarea readonly rows="10" onfocus="this.select()">${esc(t)}</textarea><br><br><button class="btn s" onclick="closeM()">Tutup</button>`)}
const sanF=x=>x.replace(/[^\w ]/g,'').trim(),MN={dash:['Menu Rekap','Summary menu'],abs:['Menu Input Harian','Daily Input menu'],kar:['Menu Karyawan','Employees menu'],ot:['Menu Lembur','Overtime menu'],lap:['Menu Atur & Laporan','Settings & Reports menu']};
const CN=[['bg','Kolom isian & tabel','Input fields & tables','Warna dasar area putih','Base color of the white areas'],['cd','Warna jendela','Window color','Badan jendela, tombol, dan menu','Window body, buttons and menus'],['tx','Warna tulisan','Text color','Teks utama','Main text'],['mu','Tulisan redup','Muted text','Keterangan kecil','Small captions'],['br','Garis tabel','Table lines','Pemisah antar baris','Row separators'],['ac','Warna tautan','Link color','Nama yang bisa diketuk','Tappable names'],['ac2','Sorotan terpilih','Selection highlight','Menu yang disorot & sel terpilih','Highlighted menu items and cells'],['dg','Hapus / peringatan','Delete / warning','Teks tombol Hapus','Delete button text'],['tt','Bar judul jendela','Window title bar','Warna biru bar judul','Title bar color'],['hl','Tepi terang','Light edge','Sisi atas/kiri tombol timbul','Top/left of raised buttons'],['lt','Tepi dalam terang','Inner light edge','Garis terang bagian dalam','Inner light line'],['sh','Tepi bayangan','Shadow edge','Sisi bawah/kanan tombol timbul','Bottom/right of raised buttons'],['dk','Tepi gelap','Dark edge','Garis paling gelap di tepi','Darkest border line']];
function pvFonts(){if(document.getElementById('pf'))return;const l=document.createElement('link');l.id='pf';l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?'+FONTS.map(f=>'family='+encodeURIComponent(f[0]).replace(/%20/g,'+')).join('&')+'&display=swap';document.head.append(l)}
function fontsHtml(k){return[...new Set(FONTS.map(f=>f[1]))].map(c=>`<div class="fcat">${L(c,FCN[c])}</div>`+FONTS.filter(f=>f[1]==c).map(f=>`<button class="fb ${TH[k]==f[0]?'on':''}" style="font-family:'${f[0]}'" onclick="setF('${k}','${f[0]}')">${f[0]}</button>`).join('')).join('')}
function setF(k,n){TH[k]=n;applyTheme();$('#f_'+k).innerHTML=fontsHtml(k);$('#fv_'+k).textContent=n}
function colorsHtml(){const m=TH.mode=='dark'?'dark':'light';return CN.map(c=>`<label class="cr"><span><b>${L(c[1],c[2])}</b><small>${L(c[3],c[4])}</small></span><input type="color" value="${TH[m][c[0]]}" oninput="TH.${m}['${c[0]}']=this.value;applyTheme()"></label>`).join('')}
function setMode(x){TH.mode=x;applyTheme();document.querySelectorAll('.mb').forEach(b=>b.classList.toggle('on',b.dataset.m==x));$('#cs').innerHTML=colorsHtml()}
function pre(i){const p=PRESETS[i][2]||THEME;TH.light={...p.light};TH.dark={...p.dark};applyTheme();$('#cs').innerHTML=colorsHtml()}
function fontBox(k,a,b){return`<details><summary>${L(a,b)}: <b id="fv_${k}">${esc(TH[k])}</b></summary><div class="fl" id="f_${k}">${fontsHtml(k)}</div><input placeholder="${L('Font lain (nama persis di Google Fonts)','Other font (exact Google Fonts name)')}" onchange="setF('${k}',sanF(this.value)||TH.${k})"></details>`}
function openTheme(){if(!guard())return;T.bk=T.bk||JSON.stringify(TH);pvFonts();
modal(`<h3>${L('Pengaturan Tema','Theme Settings')}</h3>
<div class="ts">${L('1. Bahasa','1. Language')}</div><select onchange="setLang(this.value)">${Object.entries(LANGS).map(([k,n])=>`<option value="${k}" ${k==LANG?'selected':''}>${n}</option>`).join('')}</select>
<div class="ts">${L('2. Judul & nama menu','2. Titles & menu names')}</div><label>${L('Judul aplikasi','App title')}<input value="${esc(TH.name)}" oninput="TH.name=this.value;R()"></label><label>${L('Nama usaha (tulisan kecil di header)','Business name (small text in header)')}<input value="${esc(TH.sub)}" oninput="TH.sub=this.value;R()"></label><div class="grid">${Object.keys(THEME.nav).map(k=>`<label>${L(MN[k][0],MN[k][1])}<input value="${esc(TH.nav[k])}" oninput="TH.nav['${k}']=this.value;R()"></label>`).join('')}</div>
<div class="ts">${L('3. Font (ketuk untuk memilih)','3. Fonts (tap to choose)')}</div>${fontBox('font','Font tulisan isi','Body font')}${fontBox('hfont','Font judul','Heading font')}
<div class="ts">${L('4. Warna','4. Colors')}</div><div class="mu">${L('Pilih tema warna siap pakai:','Pick a ready-made color theme:')}</div><div class="pg">${PRESETS.map((p,i)=>{const c=(p[2]||THEME).light;return`<button class="pc" onclick="pre(${i})"><b>${L(p[0],p[1])}</b><br>${[c.bg,c.cd,c.tt,c.ac].map(x=>`<i style="background:${x}"></i>`).join('')}</button>`}).join('')}</div>
<div class="mu" style="margin-top:10px">${L('Tampilan terang / gelap:','Light / dark appearance:')}</div><div class="sb">${[['light','Terang','Light'],['dark','Gelap','Dark'],['auto','Ikuti HP','Follow phone']].map(m=>`<button class="mb ${TH.mode==m[0]?'on':''}" data-m="${m[0]}" onclick="setMode('${m[0]}')">${L(m[1],m[2])}</button>`).join('')}</div>
<details><summary>${L('Atur warna sendiri (lanjutan)','Custom colors (advanced)')}</summary><div id="cs">${colorsHtml()}</div></details>
<div class="ts">${L('5. Bentuk & animasi','5. Shape & animation')}</div><label>${L('Kebulatan sudut','Corner roundness')}<input type="range" min="0" max="40" value="${TH.radius}" oninput="TH.radius=+this.value;applyTheme()"></label><label>${L('Kecepatan animasi (0 = mati)','Animation speed (0 = off)')}<input type="range" min="0" max="2" step="0.1" value="${TH.speed}" oninput="TH.speed=+this.value;applyTheme()"></label>
<div class="row" style="margin-top:12px"><button class="btn s" onclick="TH=JSON.parse(JSON.stringify(THEME));applyTheme();R();openTheme()">${L('Kembalikan bawaan','Restore defaults')}</button><button class="btn s" onclick="closeM()">${L('Batal','Cancel')}</button><button class="btn" onclick="saveTheme()">${L('Simpan','Save')}</button></div>`)}
function saveTheme(){if(!guard())return;D.th=JSON.parse(JSON.stringify(TH));T.bk=null;sv();closeM();toast(L('Tema tersimpan','Theme saved'));R()}
if(typeof MutationObserver!='undefined')new MutationObserver(ms=>ms.forEach(m=>m.addedNodes.forEach(trDom))).observe(document.body,{childList:true,subtree:true});
document.addEventListener('click',e=>{if(!e.target.closest('.mn'))cmn();const h=e.target.closest('.card>h3:first-child,.md>h3:first-child');if(h){const q=h.getBoundingClientRect();if(e.clientX>q.right-22){if(h.parentElement.classList.contains('md'))closeM();else if(!h.parentElement.classList.contains('dlgw'))h.parentElement.classList.toggle('cl')}}});
if(typeof setInterval!='undefined')setInterval(()=>{const c=document.getElementById('clk');if(c)c.textContent=clk()},15000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sbLoad(true)});
if(typeof setInterval!='undefined')setInterval(()=>{if(!document.hidden)sbLoad(true)},60000);
applyTheme();
sbCacheLoad();

if(D.me&&D.me.r=='A'){
  D.me=null;
  sv();
}

R();
sbLoad();
initAuth();
