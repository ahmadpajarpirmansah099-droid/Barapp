<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Absensi BAR · Lazy Jennie</title><style>html,body,iframe{margin:0;width:100%;height:100%;border:0}body{overflow:hidden}</style></head><body>
<iframe id="app" src="app-original.html" title="Absensi BAR"></iframe>
<script>
/* BARAPP AUTH PATCH
   Simpan index.html lama sebagai app-original.html.
   Patch ini menghapus pendaftaran Admin lokal dan memakai Supabase Auth.
*/
const frame=document.getElementById('app');
const AUTH_KEY='barapp_supabase_admin_session_v1';
function boot(){
  const w=frame.contentWindow;
  if(!w||!w.sb||!w.R)return;
  const client=w.sb();
  const oldSv=w.sv;
  const save=()=>{try{localStorage.setItem(AUTH_KEY,JSON.stringify(client.auth._getAccessToken?{}:{}))}catch(e){}};
  function setAdmin(){w.D.me={r:'A'};w.pg='dash';w.T.su=0;w.T.kl=0;if(oldSv)oldSv();w.R();}
  async function restore(){
    let s=null;try{s=JSON.parse(localStorage.getItem(AUTH_KEY)||'null')}catch(e){}
    if(s&&s.access_token&&s.refresh_token){
      const r=await client.auth.setSession({access_token:s.access_token,refresh_token:s.refresh_token});
      if(!r.error){setAdmin();return true}
      localStorage.removeItem(AUTH_KEY);
    }
    return false;
  }
  w.login=function(){
    const st='<div class="mu" style="margin:0 0 10px">'+w.sbLabel()+(w.SB.state==='err'?' - '+w.esc(w.SB.msg):'')+'</div>';
    return '<main class="lg0"><div class="card dlgw"><h3>'+w.esc(w.TH.name)+' - '+w.esc(w.TH.sub)+'</h3>'+st+
      '<div class="wlc">'+w.IC('key',32)+'<div>Login Admin menggunakan akun pusat.</div></div>'+
      '<div class="fr"><label>Email:</label><input id="lu" type="email" autocomplete="username"></div>'+
      '<div class="fr"><label>Password:</label><input id="lp" type="password" autocomplete="current-password"></div>'+
      '<div class="btns"><button class="btn" onclick="lgA()">Login Admin</button><button class="btn s" onclick="lgG()">Masuk sebagai Guest (lihat saja)</button></div>'+
      (w.T.kl?'<div class="fr" style="margin-top:12px"><label>Nama:</label><input id="li" placeholder="Nama karyawan"></div><div class="btns"><button class="btn s" onclick="lgK()">Masuk sebagai Karyawan</button></div>':'<p style="text-align:center;margin-bottom:0"><a class="nm" onclick="T.kl=1;R()">Masuk sebagai karyawan (nama)</a></p>')+
      '</div></main>';
  };
  w.lgA=async function(){
    const email=w.v('lu').trim(),pass=w.v('lp');
    if(!email||!pass)return w.toast('Email dan password wajib diisi','err');
    try{
      const r=await client.auth.signInWithPassword({email,password:pass});
      if(r.error)throw r.error;
      if(!r.data||!r.data.session)throw new Error('Session Admin tidak diterima');
      localStorage.setItem(AUTH_KEY,JSON.stringify(r.data.session));
      setAdmin();
    }catch(e){w.toast('Login Admin gagal: '+(e.message||e),'err')}
  };
  w.setPin=()=>w.toast('Pembuatan Admin baru dinonaktifkan. Buat akun Admin hanya dari Supabase Auth.','warn');
  const oldOut=w.out;
  w.out=async function(){
    if(w.D.me&&w.D.me.r==='A'){
      try{await client.auth.signOut()}catch(e){}
      localStorage.removeItem(AUTH_KEY);
    }
    w.D.me=null;if(oldSv)oldSv();w.R();
  };
  w.T.su=0;
  restore().then(ok=>{if(!ok&&!w.D.me)w.R()});
  client.auth.onAuthStateChange((event,session)=>{
    if(event==='SIGNED_OUT'){
      localStorage.removeItem(AUTH_KEY);
      if(w.D.me&&w.D.me.r==='A'){w.D.me=null;if(oldSv)oldSv();w.R()}
    }
    if((event==='TOKEN_REFRESHED'||event==='SIGNED_IN')&&session){try{localStorage.setItem(AUTH_KEY,JSON.stringify(session))}catch(e){}}
  });
}
frame.addEventListener('load',boot);
</script></body></html>
